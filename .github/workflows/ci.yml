name: CI
on:
  pull_request:
  push:
    branches: [main, feature/a-mlops, 'feature/a-day*']
permissions:
  contents: read
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q src scripts tests
      - run: python -m unittest discover -s tests -v
      - run: bash -n start.sh
      - run: bash -n scripts/cloud_smoke.sh
      - run: python scripts/ci_smoke.py
